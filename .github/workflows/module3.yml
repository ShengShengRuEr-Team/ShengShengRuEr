name: Module 3 technical checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, feature/7-module3-auto-processing]
  workflow_dispatch:
    inputs:
      processing_tests:
        description: Install frozen ASR/OCR environments and run CPU unit tests
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: module3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Windows API, PostgreSQL and migrations
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:55439/postgres
      APP_ENV: test
      JWT_SECRET_KEY: module3-ci-test-only-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
          architecture: x64
          cache: pip
          cache-dependency-path: backend/config/module3/requirements-api.lock.txt
      - name: Install frozen API dependencies
        run: python -m pip install --require-hashes -r config/module3/requirements-api.lock.txt
      - name: Start disposable PostgreSQL cluster
        run: |
          $pgArchive = Join-Path $env:RUNNER_TEMP 'postgresql-18.6.zip'
          $pgRoot = Join-Path $env:RUNNER_TEMP 'module3-postgres-binaries'
          # Vendor checksum: matching .zip.sha256 at the same EDB download URL.
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip' -OutFile $pgArchive
          $expectedHash = 'e2246ba91d22345bc3d017586c09ede52d9df180b1eeb480f050445f1cad84e2'
          if ((Get-FileHash -LiteralPath $pgArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            throw 'PostgreSQL archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $pgArchive -DestinationPath $pgRoot
          $pgBin = Join-Path $pgRoot 'pgsql\bin'
          $pgData = Join-Path $env:RUNNER_TEMP 'module3-postgres'
          "M3_CI_PG_BIN=$pgBin" >> $env:GITHUB_ENV
          "M3_CI_PG_DATA=$pgData" >> $env:GITHUB_ENV
          & (Join-Path $pgBin 'initdb.exe') -D $pgData -U postgres -A trust --encoding=UTF8 --locale=C
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $pgBin 'pg_ctl.exe') -D $pgData -l (Join-Path $env:RUNNER_TEMP 'module3-postgres.log') -o '-h 127.0.0.1 -p 55439' -w start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run isolated technical verification
        run: python -m scripts.verify_module3 --suite api --output var/ci-evidence
      - name: Check standalone console and review stopping points
        run: |
          python -m ruff check ../tools/module3-console-20261110
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python ../tools/module3-console-20261110/verify_checkout.py 2>&1 |
            Tee-Object -FilePath var/ci-evidence/console-checkout.log
          exit $LASTEXITCODE
      - name: Upload technical evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module3-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/var/ci-evidence/*.log
            backend/var/ci-evidence/*.json
            backend/var/ci-evidence/*.xml
            backend/var/ci-evidence/diagnostics/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop disposable PostgreSQL cluster
        if: always() && env.M3_CI_PG_DATA != ''
        run: |
          & (Join-Path $env:M3_CI_PG_BIN 'pg_ctl.exe') -D $env:M3_CI_PG_DATA -m fast -w stop
          exit $LASTEXITCODE

  processing:
    name: Windows ${{ matrix.suite }} CPU regression
    if: github.event_name == 'workflow_dispatch' && inputs.processing_tests
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [asr, ocr]
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install frozen environment
        run: python -m pip install --no-cache-dir --require-hashes -r config/module3/requirements-${{ matrix.suite }}.lock.txt
      - name: Run required tests without skips
        run: |
          New-Item -ItemType Directory -Force var/ci-evidence | Out-Null
          python -m scripts.run_module3_unittests --suite ${{ matrix.suite }} --output var/ci-evidence/${{ matrix.suite }}.json 2>&1 |
            Tee-Object -FilePath var/ci-evidence/${{ matrix.suite }}.log
          exit $LASTEXITCODE
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module3-${{ matrix.suite }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backend/var/ci-evidence/*.json
            backend/var/ci-evidence/*.log
          if-no-files-found: warn
          retention-days: 30
